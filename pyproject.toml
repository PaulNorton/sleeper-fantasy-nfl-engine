[project]
name = "sleeper-fantasy-nfl-engine"
version = "0.1.0"
description = "Live draft assistant for Sleeper fantasy football leagues"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
sleeper-fantasy-nfl-engine = "sleeper_fantasy_nfl_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_fantasy_nfl_engine"]
